name: Build
on:
  push:
  pull_request:
jobs:
  platformio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [oled-controller, receiver, touch-controller/left-board, touch-controller/right-board]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.project }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
      - run: pip install platformio
      - run: pio run
        working-directory: ${{ matrix.project }}

  esp-idf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # LVGL
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.4
          target: esp32s3
          path: touch-controller/display
