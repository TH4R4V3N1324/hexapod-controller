name: Build
on:
  push:
  pull_request:
jobs:
  platformio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [oled-controller, touch-controller/left-board, touch-controller/right-board]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # hexapod-gait-core: the packet header
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.project }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
      - run: pip install platformio
      - run: pio run
        working-directory: ${{ matrix.project }}

  esp-idf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: touch-controller/display
            target: esp32s3
          - project: receiver
            target: esp32
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # gait-core, LVGL, Bluepad32 and the BTstack inside it
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: ${{ matrix.target }}
          path: ${{ matrix.project }}
