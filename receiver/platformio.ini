; hexapod-controller: robot-side ESP-NOW receiver for the Servo2040 stack (stock ESP32 DevKit)
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    ; common/HexapodPackets.h: the packet layout shared with the robot firmware
    -I../common
