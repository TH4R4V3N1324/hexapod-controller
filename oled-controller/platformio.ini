; hexapod-controller: OLED controller firmware
; https://docs.platformio.org/page/projectconf.html
;
; One environment per PCB revision; pins are in include/Board.h.
;   pio run -e v5 -t upload    current board (ESP32-S3-MINI-1U), the default
;   pio run -e v3 -t upload    previous board (ESP32-S2-MINI-1)

[platformio]
default_envs = v5

[env]
platform = espressif32@6.11.0
framework = arduino
monitor_speed = 115200
build_flags =
    -Iinclude/sensors
    ; gait_core/protocol/packets.h from the gait-core submodule: the packets every robot uses
    -I../external/hexapod-gait-core/include
lib_deps =
    olikraus/U8g2@2.36.18

[env:v5]
; ESP32-S3-MINI-1U-N8: 8 MB flash, no PSRAM. USB on the S3's built-in USB serial/JTAG (GPIO19/20).
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DBOARD_REV=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:v3]
; ESP32-S2-MINI-1-N4R2, the previous board
board = esp32-s2-saola-1
board_build.usb_mode = cdc
board_build.usb_cdc_on_boot = 1
build_flags =
    ${env.build_flags}
    -DBOARD_REV=3
