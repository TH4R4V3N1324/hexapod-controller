; hexapod-controller: OLED controller firmware (ESP32-S2, PCB rev v3)
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s2-saola-1]
platform = espressif32@6.11.0
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
board_build.usb_mode = cdc
board_build.usb_cdc_on_boot = 1

build_flags =
    -Iinclude/sensors
    ; hexapod_protocol/packets.h from the gait-core submodule: the packets every robot uses
    -I../external/hexapod-gait-core/include

lib_deps =
    olikraus/U8g2@2.36.18
