; hexapod-controller: touch controller left side board (ATtiny1616), sends its inputs to the display board over UART
; https://docs.platformio.org/page/projectconf.html

[env:ATtiny1616]
platform = atmelmegaavr@1.9.0
board = ATtiny1616
framework = arduino
board_build.f_cpu = 20000000L
build_flags = -DCLOCK_SOURCE=0
monitor_speed = 115200

; Programmed through a SerialUPDI adapter. If auto-detection picks the wrong port,
; pass it on the command line: pio run -t upload --upload-port COM3
upload_protocol = serialupdi
upload_speed = 115200
